[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Prose content file. ISC004 exists to catch a missing comma silently merging
# two entries; _check_shape() verifies every entry has exactly four fields at
# runtime, which catches the same bug more directly.
"scripts/build_interview_doc.py" = ["ISC004"]
# B008 forbids a function call in an argument default. FastAPI's dependency
# system is built on exactly that -- File(...), Depends(...), Query(...) --
# so the rule is a false positive in route definitions, not a smell.
"api/main.py" = ["B008"]
